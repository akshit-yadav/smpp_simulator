[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psg-control"
version = "0.1.0"
description = "Power SMPP Gateway Simulator control plane: REST API, scheduler, licence and port checks, reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "pymysql>=1.1,<2",
    "alembic>=1.14,<2",
    "redis>=5.2,<7",
    "httpx>=0.27,<1",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
    "cryptography>=43,<50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["psg_control*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S104"]  # binding 0.0.0.0 is configurable on purpose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
# SQL there is built from constant fragments only; every value is a ClickHouse query parameter.
"psg_control/api/reports.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
