name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [worker, loadgen, tools/licgen]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
    env:
      PSG_TEST_REDIS_ADDR: 127.0.0.1:6379
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
    env:
      PSG_TEST_MARIADB_URL: mysql+pymysql://root:root@127.0.0.1:3306
      PSG_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: create the alembic-check database
        run: python -c "import pymysql; pymysql.connect(host='127.0.0.1', user='root', password='root').cursor().execute('CREATE DATABASE psg_ci')" && PSG_MARIADB_PORT=3306 PSG_MARIADB_USER=root PSG_MARIADB_PASSWORD=root PSG_MARIADB_DATABASE=psg_ci alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: migrations match the models
        run: alembic check
        env:
          PSG_MARIADB_HOST: 127.0.0.1
          PSG_MARIADB_PORT: 3306
          PSG_MARIADB_USER: root
          PSG_MARIADB_PASSWORD: root
          PSG_MARIADB_DATABASE: psg_ci

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    needs: [go, control, panel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
